[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nadejda"
dynamic = ["version"]
description = "Transparent DPI desynchronisation for Linux (nftables/NFQUEUE) and Windows (WinDivert)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nadejda contributors" }]
classifiers = [
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Networking",
]
dependencies = [
  "pydivert>=4.0; sys_platform == 'win32'",
]

[project.scripts]
nadejda-win = "nadejda.win.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nadejda.__version__" }

[tool.setuptools.packages.find]
include = ["nadejda*"]
